<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c1210">
<title>Sem conexão · Notice</title>
<link rel="icon" href="/favicon.png">
<style>
  :root{--bg:#eef3ef;--fg:#0c1210;--surface:#f7faf7;--border:rgba(12,18,16,.12);--muted:#5a6b62;--accent:#c45c26}
  @media (prefers-color-scheme:dark){:root{--bg:#0c1210;--fg:#e8efe9;--surface:#121a17;--border:rgba(232,239,233,.12);--muted:#8a9a90}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto;text-align:center}
  h1{font-size:1.5rem;margin:.5rem 0}
  p{color:var(--muted);font-size:.95rem;line-height:1.5}
  ul{list-style:none;padding:0;margin:1.5rem 0;text-align:left;display:grid;gap:8px}
  a.item{display:block;padding:14px;border:1px solid var(--border);background:var(--surface);border-radius:12px;color:var(--fg);text-decoration:none;font-size:.95rem;line-height:1.35}
  button{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--accent);color:#fff8f3;font-weight:600;font-size:.95rem}
  img{width:56px;height:56px}
</style>
</head>
<body>
<main>
  <img src="/logo-128.png" alt="MutterCorp" width="56" height="56">
  <h1>Você está offline</h1>
  <p>Sem conexão no momento. As notícias e CVEs que você abriu recentemente continuam disponíveis abaixo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
  <ul id="saved"></ul>
</main>
<script>
(async function () {
  var ul = document.getElementById("saved");
  try {
    var names = await caches.keys();
    var name = names.find(function (n) { return n.indexOf("notice-pages") === 0; });
    if (!name) throw 0;
    var cache = await caches.open(name);
    var reqs = (await cache.keys()).slice().reverse();
    var n = 0;
    for (var i = 0; i < reqs.length && n < 30; i++) {
      var u = new URL(reqs[i].url);
      if (u.pathname === "/offline.html" || /\.(png|svg|ico)$/.test(u.pathname)) continue;
      var res = await cache.match(reqs[i]);
      var html = res ? await res.text() : "";
      var m = /<title>([^<]*)<\/title>/i.exec(html);
      var t = (m ? m[1] : u.pathname).replace(/ · Notice$/, "");
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "item"; a.href = u.pathname + u.search; a.textContent = t;
      li.appendChild(a); ul.appendChild(li); n++;
    }
    if (!n) throw 0;
  } catch (e) {
    ul.innerHTML = '<li><p>Nenhuma página salva ainda.</p></li>';
  }
})();
</script>
</body>
</html>
